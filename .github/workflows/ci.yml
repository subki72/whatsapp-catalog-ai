name: Continuous Integration & Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run test suite with coverage
        run: |
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=75

      - name: Build Docker container image
        run: |
          docker build -t whatsapp-catalog-ai:smoke .

      - name: Scan container image with Trivy for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'whatsapp-catalog-ai:smoke'
          format: 'table'
          severity: 'CRITICAL,HIGH'
