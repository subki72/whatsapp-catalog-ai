<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
    <title>KatalogKu — Etalase Digital Otomatis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <div class="app-container">

        <header class="app-header">
            <h1 class="logo-title"><span class="logo-icon"></span> KatalogKu</h1>
            <p class="subtitle">Etalase Digital Otomatis Anda</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="phoneInput" placeholder="Masukkan Nomor WhatsApp (Misal: 62812...)">
                <button id="searchBtn" class="primary-btn" type="button">Cari Katalog</button>
                <button id="showAllBtn" class="primary-btn" type="button">Tampilkan Semua</button>
            </div>
            <p id="statusMessage" class="status-msg">Menampilkan semua katalog yang tersedia. Masukkan nomor WhatsApp hanya jika ingin memfilter katalog tertentu.</p>
        </section>

        <main id="catalogGrid" class="catalog-grid"></main>

    </div>

    <script src="/static/app.js"></script>
</body>
</html>
